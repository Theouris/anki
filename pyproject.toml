[project]
name = "anki-dev"
version = "0.0.0"
description = "Local-only environment"
requires-python = ">=3.9"
classifiers = ["Private :: Do Not Upload"]

[dependency-groups]
dev = [
  "mypy",
  "mypy-protobuf",
  "ruff",
  "pytest",
  "PyChromeDevTools",
  "wheel",
  "hatchling", # for type checking hatch_build.py files
  "mock",
  "types-protobuf",
  "types-requests",
  "types-orjson",
  "types-decorator",
  "types-flask",
  "types-flask-cors",
  "types-markdown",
  "types-waitress",
  "types-pywin32",
]

[project.optional-dependencies]
sphinx = [
  "sphinx",
  "sphinx_rtd_theme",
  "sphinx-autoapi",
]

[tool.uv.workspace]
members = ["pylib", "qt"]

[tool.uv]
override-dependencies = [
  "pyqt6-qt6; sys_platform == 'win32' and platform_machine == 'ARM64' and python_version < '0'",
  "pyqt6-webengine-qt6; sys_platform == 'win32' and platform_machine == 'ARM64' and python_version < '0'",
]

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true
